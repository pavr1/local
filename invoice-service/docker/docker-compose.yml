services:
  invoice-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: icecream_invoice
    restart: unless-stopped
    environment:
      # Server Configuration
      INVOICE_SERVER_HOST: 0.0.0.0
      INVOICE_SERVER_PORT: 8085
      
      # Database Configuration (connect to existing data-service database)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: icecream_store
      DB_SSLMODE: disable
      
      # Logging Configuration
      LOG_LEVEL: info
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/v1/invoices/p/health"]
      interval: 1s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docker_icecream_network

networks:
  docker_icecream_network:
    external: true
