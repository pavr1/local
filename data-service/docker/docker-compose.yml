services:
  postgres:
    image: postgres:15-alpine
    container_name: icecream_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: icecream_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icecream_store"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docker_icecream_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: icecream_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@icecreamstore.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - docker_icecream_network

  data-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: icecream_data_service
    restart: unless-stopped
    environment:
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8086
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: icecream_store
      DB_SSL_MODE: disable
      
      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - docker_icecream_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  docker_icecream_network:
    driver: bridge 