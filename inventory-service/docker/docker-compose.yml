services:
  inventory-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: icecream_inventory
    restart: unless-stopped
    environment:
      # Server Configuration
      INVENTORY_SERVER_HOST: 0.0.0.0
      INVENTORY_SERVER_PORT: 8084
      
      # Gateway Configuration
      GATEWAY_URL: http://localhost:8082
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: icecream_store
      DB_SSLMODE: disable
      
      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/v1/inventory/p/health"]
      interval: 1s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docker_icecream_network

networks:
  docker_icecream_network:
    external: true
