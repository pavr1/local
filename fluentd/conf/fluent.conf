# Fluentd configuration for centralized logging

# Input plugin - collect logs from services via forward protocol
<source>
  @type forward
  port 24224
  bind 0.0.0.0
  tag service.*
</source>

# Input plugin - collect logs from files (fallback)
<source>
  @type tail
  path /fluentd/log/*.log
  pos_file /fluentd/log/fluentd.log.pos
  tag service.*
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%L%z
</source>

# Parse and enrich logs
<filter service.**>
  @type parser
  key_name message
  <parse>
    @type regexp
    expression /^\[(?<timestamp>[^\]]+)\] (?<level>[A-Z]+) \[(?<service>[^\]]+)\] (?<message>.*)$/
  </parse>
</filter>

# Add service name from tag
<filter service.**>
  @type record_transformer
  <record>
    service_name ${tag_parts[1]}
    log_level ${record["level"] || "INFO"}
    log_message ${record["message"] || record["msg"] || ""}
    log_timestamp ${record["timestamp"] || time}
  </record>
</filter>

# Output to Elasticsearch with proper indexing
<match service.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix ice-cream-logs
  include_tag_key true
  tag_key @log_name
  time_key log_timestamp
  time_precision 3
  flush_interval 1s
  <buffer>
    @type memory
    flush_interval 1s
    chunk_limit_size 2M
    queue_limit_length 8
    retry_max_interval 30
    retry_forever false
  </buffer>
</match>

# Output to console for debugging
<match service.**>
  @type stdout
</match> 