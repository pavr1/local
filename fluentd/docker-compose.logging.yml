services:
  # Elasticsearch - Log storage and search engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - logging

  # Kibana - Log visualization and management
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - logging

  # Fluentd - Log collector and aggregator
  fluentd:
    image: fluent/fluentd:v1.16-1
    container_name: fluentd
    volumes:
      - ./fluentd/conf:/fluentd/etc
      - ./logs:/fluentd/log
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      - elasticsearch
    networks:
      - logging
    command: fluentd -c /fluentd/etc/fluent.conf -v

  # Health Check Service - Provides health endpoints for the logging stack
  health-check:
    image: curlimages/curl:latest
    container_name: fluentd-health-check
    volumes:
      - ./health-check.sh:/health-check.sh
    ports:
      - "8087:8087"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KIBANA_URL=http://kibana:5601
      - FLUENTD_HOST=fluentd
      - FLUENTD_PORT=24224
    depends_on:
      - elasticsearch
      - kibana
      - fluentd
    networks:
      - logging
    command: sh -c "chmod +x /health-check.sh && /health-check.sh"

volumes:
  elasticsearch_data:
    driver: local

networks:
  logging:
    driver: bridge 