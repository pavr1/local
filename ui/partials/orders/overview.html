        <div class="col-lg-3 col-md-6 mb-4">

                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h6 class="card-title">Completed</h6>
                            <h3 class="mb-0" id="completedOrders">0</h3>
                        </div>

                            <i class="fas fa-check-circle fa-2x"></i>

            </div>
        </div>

        <div class="col-lg-3 col-md-6 mb-4">
            <div class="card bg-warning text-dark h-100 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h6 class="card-title">Pending</h6>
                            <h3 class="mb-0" id="pendingOrders">0</h3>
                        </div>

                </div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6 mb-4">
            <div class="card bg-info text-white h-100 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h6 class="card-title">Today's Revenue</h6>
                            <h3 class="mb-0" id="todayRevenue">₡0.00</h3>
                        </div>
                        <div class="align-self-center">
                            <i class="fas fa-dollar-sign fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="fas fa-bolt me-2"></i>Quick Actions</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <button class="btn btn-outline-primary w-100 h-100 p-3" onclick="openCreateOrderModal()">
                                <i class="fas fa-plus-circle fa-2x mb-2"></i>
                                <br>
                                <strong>Create Order</strong>
                                <br>
                                <small>Add new ice cream order</small>
                            </button>
                        </div>
                        <div class="col-md-3 mb-3">
                            <button class="btn btn-outline-success w-100 h-100 p-3" onclick="loadContent('orders-list')">
                                <i class="fas fa-list fa-2x mb-2"></i>
                                <br>
                                <strong>View Orders</strong>
                                <br>
                                <small>Browse all orders</small>
                            </button>
                        </div>
                        <div class="col-md-3 mb-3">
                            <button class="btn btn-outline-info w-100 h-100 p-3" onclick="loadContent('orders-reports')">
                                <i class="fas fa-chart-bar fa-2x mb-2"></i>

                            <button class="btn btn-outline-warning w-100 h-100 p-3" onclick="loadContent('orders-settings')">

    </div>

    <!-- Recent Orders -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fas fa-history me-2"></i>Recent Orders</h5>
                    <button class="btn btn-sm btn-outline-primary" onclick="loadContent('orders-list')">
                        View All
                    </button>
                </div>
                <div class="card-body">
                    <div id="recentOrdersTable" class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Order #</th>
                                    <th>Date</th>
                                    <th>Payment Method</th>
                                    <th>Status</th>
                                    <th>Total</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recentOrdersTableBody">
                                <!-- Recent orders will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="noRecentOrders" class="text-center text-muted py-4">
                        <i class="fas fa-shopping-cart fa-3x mb-3"></i>
                        <p>No recent orders found.</p>
                        <button class="btn btn-primary" onclick="openCreateOrderModal()">
                            <i class="fas fa-plus me-2"></i>Create Your First Order
                        </button>
                    </div>
                    
                    <div id="serviceUnavailable" class="text-center text-warning py-4" style="display: none;">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                        <h5>Orders Service Unavailable</h5>
                        <p>The orders service is currently not available. Please try again later.</p>
                        <button class="btn btn-outline-warning" onclick="initOrdersOverviewContent()">
                            <i class="fas fa-refresh me-2"></i>Retry
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Include Create Order Modal -->
<div id="createOrderModalContainer"></div>

<script>
// Global variables
let ordersSummary = {};

// Initialize the orders overview page
window.initOrdersOverviewContent = async function() {
    console.log('🛒 Initializing orders overview content...');
    
    // Load create order modal content
    await loadCreateOrderModal();
    
    // Test orders service health first
    try {
        const healthResponse = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/orders/p/health`);
        console.log('Orders service health check:', healthResponse);
    } catch (error) {
        console.error('Orders service health check failed:', error);
    }
    
    await loadOrdersSummary();
    await loadRecentOrders();
};

// Load orders summary statistics
window.loadOrdersSummary = async function() {
    try {
        console.log('Loading orders summary...');
        const response = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/orders/summary`);
        console.log('Orders summary response:', response);
        
        if (!response.ok) {
            throw new Error(`Failed to fetch orders summary: ${response.status}`);
        }
        
        const result = await response.json();
        console.log('Orders summary result:', result);
        
        if (result.success) {
            ordersSummary = result.data;
            updateSummaryCards();
        } else {
            console.error('Failed to load orders summary:', result.message);
            showServiceUnavailable();
            return;
        }
    } catch (error) {
        console.error('Error loading orders summary:', error);
        showServiceUnavailable();
        return;
    }
    
    // If we get here, the API call was successful
    hideServiceUnavailable();
}

// Update summary cards
window.updateSummaryCards = function() {
    document.getElementById('totalOrders').textContent = ordersSummary.total_orders || 0;
    document.getElementById('completedOrders').textContent = ordersSummary.completed_orders || 0;
    document.getElementById('pendingOrders').textContent = ordersSummary.pending_orders || 0;
    document.getElementById('todayRevenue').textContent = `₡${(ordersSummary.today_revenue || 0).toFixed(2)}`;
}

// Load recent orders
window.loadRecentOrders = async function() {
    try {
        // Get today's date range
        const today = new Date();
        const dateFrom = today.toISOString().split('T')[0];
        const dateTo = today.toISOString().split('T')[0];
        
        console.log('Loading recent orders for date range:', dateFrom, 'to', dateTo);
        const response = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/orders/by-date-range?date_from=${dateFrom}&date_to=${dateTo}&limit=5`);
        console.log('Recent orders response:', response);
        
        if (!response.ok) {
            throw new Error(`Failed to fetch recent orders: ${response.status}`);
        }
        
        const result = await response.json();
        console.log('Recent orders result:', result);
        
        if (result.success) {
            displayRecentOrders(result.data);
        } else {
            console.error('Failed to load recent orders:', result.message);
            showServiceUnavailable();
            return;
        }
    } catch (error) {
        console.error('Error loading recent orders:', error);
        showServiceUnavailable();
        return;
    }
    
    // If we get here, the API call was successful
    hideServiceUnavailable();
}

// Display recent orders
window.displayRecentOrders = function(orders) {
    const tbody = document.getElementById('recentOrdersTableBody');
    const noOrdersDiv = document.getElementById('noRecentOrders');
    const tableDiv = document.getElementById('recentOrdersTable');
    
    // Handle case where orders is not an array
    if (!orders || !Array.isArray(orders) || orders.length === 0) {
        tbody.innerHTML = '';
        noOrdersDiv.style.display = 'block';
        tableDiv.style.display = 'none';
        return;
    }
    
    noOrdersDiv.style.display = 'none';
    tableDiv.style.display = 'block';
    tbody.innerHTML = '';
    
    orders.forEach(order => {
        const row = document.createElement('tr');
        const orderDate = new Date(order.transaction_timestamp).toLocaleDateString();
        const statusBadge = getStatusBadge(order.status);
        
        row.innerHTML = `
            <td><strong>${order.order_number}</strong></td>
            <td>${orderDate}</td>
            <td>
                <span class="badge bg-secondary">${order.payment_method}</span>
            </td>
            <td>${statusBadge}</td>
            <td><strong>₡${order.total_amount.toFixed(2)}</strong></td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="viewOrder('${order.id}')">
                    <i class="fas fa-eye"></i>
                </button>
            </td>
        `;
        tbody.appendChild(row);
    });
}

// Get status badge HTML
window.getStatusBadge = function(status) {
    const statusConfig = {
        'pending': { class: 'bg-warning text-dark', icon: 'clock' },
        'completed': { class: 'bg-success', icon: 'check-circle' },
        'cancelled': { class: 'bg-danger', icon: 'times-circle' },
        'sinpe_pending': { class: 'bg-info', icon: 'credit-card' }
    };
    
    const config = statusConfig[status] || { class: 'bg-secondary', icon: 'question-circle' };
    
    return `<span class="badge ${config.class}">
        <i class="fas fa-${config.icon} me-1"></i>${status}
    </span>`;
}

// View order details
window.viewOrder = function(orderId) {
    // This will be implemented when we create the order details page
    showInfo('Order details view will be implemented soon');
}

// Show service unavailable message
window.showServiceUnavailable = function() {
    const serviceUnavailableDiv = document.getElementById('serviceUnavailable');
    const recentOrdersTable = document.getElementById('recentOrdersTable');
    const noRecentOrdersDiv = document.getElementById('noRecentOrders');
    
    if (serviceUnavailableDiv) serviceUnavailableDiv.style.display = 'block';
    if (recentOrdersTable) recentOrdersTable.style.display = 'none';
    if (noRecentOrdersDiv) noRecentOrdersDiv.style.display = 'none';
}

// Hide service unavailable message
window.hideServiceUnavailable = function() {
    const serviceUnavailableDiv = document.getElementById('serviceUnavailable');
    if (serviceUnavailableDiv) serviceUnavailableDiv.style.display = 'none';
}

// Load create order modal content
async function loadCreateOrderModal() {
    try {
        console.log('🔄 Loading create order modal content...');
        const response = await fetch('partials/orders/create-order.html');
        const content = await response.text();
        console.log('📄 Modal content loaded, length:', content.length);
        
        const container = document.getElementById('createOrderModalContainer');
        if (container) {
            container.innerHTML = content;
            console.log('✅ Modal content inserted into container');
            
            // Extract and execute script content
            const scriptMatch = content.match(/<script>([\s\S]*?)<\/script>/);
            if (scriptMatch) {
                console.log('📜 Found script content, executing...');
                try {
                    eval(scriptMatch[1]);
                    console.log('✅ Script executed successfully');
                } catch (scriptError) {
                    console.error('❌ Error executing script:', scriptError);
                }
            } else {
                console.error('❌ No script content found in modal HTML');
            }
            
            // Check if functions are available after loading
            setTimeout(() => {
                console.log('🔍 Checking available functions after loading:');
                console.log('- window.initCreateOrder:', typeof window.initCreateOrder);
                console.log('- window.filterRecipes:', typeof window.filterRecipes);
                console.log('- window.selectRecipe:', typeof window.selectRecipe);
            }, 50);
        } else {
            console.error('❌ createOrderModalContainer not found!');
        }
    } catch (error) {
        console.error('❌ Error loading create order modal:', error);
    }
}

// Open create order modal
async function openCreateOrderModal() {
    console.log('🛒 Opening Create Order Modal...');
    
    try {
        // Load modal content first
        await loadCreateOrderModal();
        
        // Small delay to ensure content is loaded
        setTimeout(() => {
            // Initialize the create order functionality
            if (typeof window.initCreateOrder === 'function') {
                console.log('🔧 Calling initCreateOrder...');
                window.initCreateOrder();
            } else {
                console.error('❌ initCreateOrder function not found!');
            }
            
            // Show the modal
            const modal = new bootstrap.Modal(document.getElementById('createOrderModal'));
            modal.show();
        }, 100);
        
    } catch (error) {
        console.error('❌ Error opening create order modal:', error);
    }
}

// Expose the local function globally with a different name
window.openCreateOrderModalLocal = openCreateOrderModal;

// Functions are now globally available for the dashboard to call
</script>
