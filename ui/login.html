<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Store - Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Shared CSS -->
    <link rel="stylesheet" href="shared/css/style.css?v=1.3">
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 1200px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="row h-100">
            <!-- Left Panel - Branding -->
            <div class="col-lg-6 d-none d-lg-flex branding-panel">
                <div class="branding-content">
                    <div class="brand-logo">
                        <i class="fas fa-ice-cream fa-4x text-white mb-4"></i>
                        <h1 class="brand-title">Ice Cream Store</h1>
                        <p class="brand-subtitle">Management System</p>
                    </div>
                    <div class="features-list">
                        <div class="feature-item">
                            <i class="fas fa-shield-alt"></i>
                            <span>Secure Authentication</span>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-shopping-cart"></i>
                            <span>Order Management</span>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-warehouse"></i>
                            <span>Inventory Control</span>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-chart-line"></i>
                            <span>Analytics Dashboard</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Panel - Login Form -->
            <div class="col-lg-6 login-panel">
                <div class="login-form-container">
                    <div class="text-center mb-5">
                        <div class="mobile-brand d-lg-none mb-4">
                            <i class="fas fa-ice-cream fa-3x text-primary"></i>
                            <h2 class="mt-2">Ice Cream Store</h2>
                        </div>
                        <h3 class="login-title">Welcome Back!</h3>
                        <p class="login-subtitle text-muted">Please sign in to your account</p>
                    </div>

                    <!-- Alert Messages -->
                    <div id="alert-container"></div>

                    <!-- Login Form -->
                    <form id="loginForm" class="login-form">
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                <i class="fas fa-user me-2"></i>Username
                            </label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="username" 
                                   name="username"
                                   placeholder="Enter your username"
                                   required
                                   autocomplete="username">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-2"></i>Password
                            </label>
                            <div class="input-group">
                                <input type="password" 
                                       class="form-control form-control-lg" 
                                       id="password" 
                                       name="password"
                                       placeholder="Enter your password"
                                       required
                                       autocomplete="current-password">
                                <button class="btn btn-outline-secondary" 
                                        type="button" 
                                        id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       id="rememberMe"
                                       name="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Remember me for 30 days
                                </label>
                            </div>
                        </div>

                        <button type="submit" 
                                class="btn btn-primary btn-lg w-100 login-btn"
                                id="loginBtn">
                            <span class="btn-text">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </span>
                            <span class="btn-loading d-none">
                                <i class="fas fa-spinner fa-spin me-2"></i>Signing In...
                            </span>
                        </button>
                    </form>

                    <!-- Additional Links -->
                    <div class="text-center mt-4">
                        <p class="text-muted">
                            Need help? Contact your system administrator
                        </p>
                    </div>

                    <!-- Login System Status (Loaded Dynamically) -->
                    <div id="login-system-status-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center py-5">
                    <div class="success-animation mb-4">
                        <i class="fas fa-check-circle fa-4x text-success"></i>
                    </div>
                    <h4 class="mb-3">Login Successful!</h4>
                    <p class="text-muted mb-4">Redirecting to dashboard...</p>
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" 
                             style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Configuration -->
    <script src="config.js?v=1.3"></script>
    
    <!-- Response Utilities (must load before auth.js) -->
    <script src="shared/js/response-utils.js"></script>
    
    <!-- Authentication Service -->
    <script src="shared/js/auth.js?v=1.4"></script>
    
    <!-- Status Service -->
    <script src="shared/js/status.js?v=1.2"></script>
    
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    
    <!-- Custom Alert System -->
    <script src="shared/js/alerts.js?v=1.0"></script>
    
    <!-- Partial loader -->
    <script src="shared/js/load-partials.js?v=1.0"></script>
    
    <!-- Login Page JavaScript -->
    <script>
        // === LOGIN PAGE FUNCTIONALITY ===
        
        class LoginPage {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.usernameInput = document.getElementById('username');
                this.passwordInput = document.getElementById('password');
                this.rememberMeInput = document.getElementById('rememberMe');
                this.togglePasswordBtn = document.getElementById('togglePassword');
                this.loginBtn = document.getElementById('loginBtn');
                this.alertContainer = document.getElementById('alert-container');
                
                this.init();
            }

            init() {
                console.log('🔧 Initializing login page...');
                
                // Debug: Check if services are available
                console.log('🔍 CONFIG available:', typeof CONFIG !== 'undefined');
                console.log('🔍 authService available:', typeof window.authService !== 'undefined');
                console.log('🔍 statusService available:', typeof window.statusService !== 'undefined');
                
                // Bind event listeners
                this.form.addEventListener('submit', this.handleLogin.bind(this));
                this.togglePasswordBtn.addEventListener('click', this.togglePassword.bind(this));
                
                // Add validation on field blur (when user leaves the field)
                this.usernameInput.addEventListener('blur', this.validateUsername.bind(this));
                this.passwordInput.addEventListener('blur', this.validatePassword.bind(this));
                
                // Check if already authenticated
                this.checkExistingAuth();
                
                // Status monitoring is now handled by the system-status component itself
                
                console.log('✅ Login page initialized');
            }

            async checkExistingAuth() {                
                if (window.authService && window.authService.isAuthenticated()) {
                    console.log('🔍 User already authenticated, validating session...');
                    const sessionId = window.authService.getSessionId();
                    
                    if (sessionId) {
                        try {
                            // Validate session by calling the gateway validate endpoint
                            console.log('🔍 Validating session with gateway...');
                            const response = await fetch(`${CONFIG.GATEWAY_URL}/api/v1/sessions/p/validate`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    session_id: sessionId
                                })
                            });
                            
                            if (response.ok) {
                                const data = await response.json();
                                // Handle new centralized response structure
                                const isValid = data.data?.valid || data.valid;
                                
                                if (isValid) {
                                    console.log('✅ Session is valid, redirecting...');
                                    this.showAlert('Already signed in. Redirecting...', 'success');
                                    setTimeout(() => {
                                        console.log('🎉 Redirecting to dashboard...');
                                        window.location.href = 'dashboard.html';
                                    }, 1000);
                                } else {
                                    console.log('⚠️ Session is invalid, clearing auth data...');
                                    window.authService.clearAuthData();
                                    this.showAlert('Session is invalid. Please login again.', 'info');
                                }
                            } else if (response.status === 401) {
                                console.log('⚠️ Session expired, clearing auth data...');
                                window.authService.clearAuthData();
                                this.showAlert('Previous session expired. Please login again.', 'info');
                            } else {
                                console.log('⚠️ Session validation failed, clearing auth data...');
                                window.authService.clearAuthData();
                                this.showAlert('Session validation failed. Please login again.', 'info');
                            }
                        } catch (error) {
                            console.error('❌ Error validating session:', error);
                            // If we can't validate the session, clear it to be safe
                            window.authService.clearAuthData();
                            this.showAlert('Unable to validate session. Please login again.', 'info');
                        }
                    } else {
                        console.log('🔍 No session ID found');
                    }
                } else {
                    console.log('🔍 User not authenticated or authService not available');
                }
            }

            async handleLogin(event) {
                event.preventDefault();
                
                const username = this.usernameInput.value.trim();
                const password = this.passwordInput.value;
                const rememberMe = this.rememberMeInput.checked;

                if (!this.validateForm()) {
                    return;
                }

                this.setLoading(true);
                this.clearAlerts();

                try {
                    console.log('🔑 Starting login process...');
                    
                    // Debug and try to fix authService if missing
                    if (!window.authService) {
                        console.warn('⚠️ authService not found, attempting to recreate...');
                        if (typeof CONFIG !== 'undefined' && typeof AuthService !== 'undefined') {
                            window.authService = new AuthService();
                            console.log('✅ authService recreated');
                        } else {
                            console.error('❌ Cannot recreate authService - missing dependencies');
                            console.log('CONFIG available:', typeof CONFIG !== 'undefined');
                            console.log('AuthService class available:', typeof AuthService !== 'undefined');
                            throw new Error('Authentication service not available - missing CONFIG or AuthService class');
                        }
                    }
                    
                    const result = await window.authService.login(username, password, rememberMe);
                    
                    console.log('✅ Login successful:', result);
                    this.showAlert('Login successful! Session created.', 'success');
                    
                    // Show success modal and redirect to dashboard
                    this.showSuccessModal();
                    
                    // Redirect to dashboard after brief delay
                    setTimeout(() => {
                        console.log('🎉 Login complete - redirecting to dashboard');
                        window.location.href = 'dashboard.html';
                    }, 1500);
                    
                } catch (error) {
                    console.error('❌ Login failed:', error.message);
                    this.showAlert(error.message, 'error');
                } finally {
                    this.setLoading(false);
                }
            }

            validateForm() {
                let isValid = true;
                
                // Reset validation states
                this.clearValidation();
                
                // Validate username
                if (!this.usernameInput.value.trim()) {
                    this.setFieldError(this.usernameInput, 'Username is required');
                    isValid = false;
                }
                
                // Validate password
                if (!this.passwordInput.value) {
                    this.setFieldError(this.passwordInput, 'Password is required');
                    isValid = false;
                }
                
                return isValid;
            }

            validateUsername() {
                const username = this.usernameInput.value.trim();
                if (username.length >= 3) {
                    this.setFieldValid(this.usernameInput);
                } else if (username.length > 0) {
                    this.setFieldError(this.usernameInput, 'Invalid length');
                } else {
                    this.clearFieldValidation(this.usernameInput);
                }
            }

            validatePassword() {
                const password = this.passwordInput.value;
                if (password.length >= 3) {
                    this.setFieldValid(this.passwordInput);
                } else if (password.length > 0) {
                    this.setFieldError(this.passwordInput, 'Invalid length');
                } else {
                    this.clearFieldValidation(this.passwordInput);
                }
            }

            setFieldError(field, message) {
                field.classList.add('is-invalid');
                field.classList.remove('is-valid');
                const feedback = field.parentElement.querySelector('.invalid-feedback') || 
                                field.nextElementSibling;
                if (feedback) {
                    feedback.textContent = message;
                }
            }

            setFieldValid(field) {
                field.classList.add('is-valid');
                field.classList.remove('is-invalid');
            }

            clearFieldValidation(field) {
                field.classList.remove('is-valid', 'is-invalid');
            }

            clearValidation() {
                document.querySelectorAll('.form-control').forEach(field => {
                    this.clearFieldValidation(field);
                });
            }

            togglePassword() {
                const type = this.passwordInput.type === 'password' ? 'text' : 'password';
                this.passwordInput.type = type;
                
                const icon = this.togglePasswordBtn.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            }

            setLoading(loading) {
                this.loginBtn.disabled = loading;
                
                const btnText = this.loginBtn.querySelector('.btn-text');
                const btnLoading = this.loginBtn.querySelector('.btn-loading');
                
                if (loading) {
                    btnText.classList.add('d-none');
                    btnLoading.classList.remove('d-none');
                } else {
                    btnText.classList.remove('d-none');
                    btnLoading.classList.add('d-none');
                }
            }

            showAlert(message, type = 'info') {
                Swal.fire({
                    icon: type,
                    title: message,
                    showConfirmButton: false,
                    timer: 3000,
                    toast: true,
                    position: 'top-end',
                    background: '#f8f9fa',
                    color: '#343a40',
                    customClass: {
                        popup: 'swal-popup',
                        title: 'swal-title',
                        content: 'swal-content',
                        confirmButton: 'swal-confirm-button',
                        cancelButton: 'swal-cancel-button',
                        footer: 'swal-footer'
                    }
                });
            }

            clearAlerts() {
                // Clear SweetAlert2 messages
                Swal.close();
            }

            showSuccessModal() {
                const modal = new bootstrap.Modal(document.getElementById('successModal'));
                modal.show();
                
                // Animate progress bar
                const progressBar = document.querySelector('.progress-bar');
                let width = 0;
                const interval = setInterval(() => {
                    width += 5;
                    progressBar.style.width = width + '%';
                    
                    if (width >= 100) {
                        clearInterval(interval);
                        setTimeout(() => {
                            modal.hide();
                        }, 500);
                    }
                }, 50);
            }


        }

        // Initialize login page when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            // Load login system status partial
            const loaded = await window.PartialLoader.loadPartial('shared/partials/login-system-status.html', 'login-system-status-container');
            if (loaded) {
                console.log('✅ Login system status partial loaded');
                
                // Initialize the login system status component after partial is loaded
                setTimeout(() => {
                    console.log('🔧 Login System Status Component: Attempting to initialize from login page...');
                    
                    // Create a simple login system status component
                    class LoginSystemStatusComponent {
                        constructor() {
                            console.log('🔧 LoginSystemStatusComponent: Constructor called');
                            this.healthCheckInterval = null;
                            this.statusMapping = {
                                'gateway': 'login-gateway-status',
                                'session': 'login-session-status', 
                                'orders': 'login-orders-status',
                                'inventory': 'login-inventory-status',
                                'invoices': 'login-invoices-status'
                            };
                            
                            console.log('🔧 LoginSystemStatusComponent: Status mapping created:', this.statusMapping);
                            this.init();
                        }
                        
                        init() {
                            console.log('🔧 LoginSystemStatusComponent: Init method called');
                            this.startMonitoring();
                            this.setupRefreshButton();
                        }
                        
                        startMonitoring() {
                            console.log('🏥 Login System Status Component: Starting health monitoring...');
                            
                            // Start real-time health monitoring every 2 seconds
                            this.startRealTimeMonitoring();
                            
                            // More frequent initial checks to get status quickly
                            setTimeout(() => this.performRealTimeHealthCheck(), 500);
                            setTimeout(() => this.performRealTimeHealthCheck(), 1500);
                            setTimeout(() => this.performRealTimeHealthCheck(), 3000);
                        }
                        
                        startRealTimeMonitoring() {
                            console.log('🔄 Login System Status Component: Starting real-time monitoring...');
                            
                            // Clear any existing interval
                            if (this.healthCheckInterval) {
                                clearInterval(this.healthCheckInterval);
                            }
                            
                            // Set up automatic health checking every 2 seconds for real-time status
                            this.healthCheckInterval = setInterval(async () => {
                                console.log('⏰ [Auto] Login system status: Timer triggered, performing health check...');
                                await this.performRealTimeHealthCheck();
                            }, 2000); // 2 seconds for real-time updates
                            
                            console.log('✅ Login System Status Component: Real-time monitoring started with 2-second interval');
                        }
                        
                        async performRealTimeHealthCheck() {
                            try {
                                console.log('🔄 [Auto] Login system status: Performing real-time health check...');
                                
                                // Use AbortController for better browser compatibility
                                const controller = new AbortController();
                                const timeoutId = setTimeout(() => controller.abort(), 5000);
                                
                                const healthUrl = CONFIG.GATEWAY_URL + '/api/v1/gateway/p/health';
                                console.log('🌐 [Auto] Login system status: Fetching from:', healthUrl);
                                
                                const response = await fetch(healthUrl, {
                                    method: 'GET',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    signal: controller.signal
                                });
                                
                                clearTimeout(timeoutId);
                                
                                if (response.ok) {
                                    const healthData = await response.json();
                                    console.log('✅ [Auto] Login system status: Health check successful:', healthData);
                                    
                                    // Handle new centralized response structure
                                    const services = healthData.data?.services || healthData.services;
                                    
                                    // Update status indicators based on gateway health response
                                    if (services) {
                                        this.updateStatusFromGateway(services);
                                    }
                                    
                                } else {
                                    throw new Error(`Gateway health check failed: ${response.status}`);
                                }
                                
                            } catch (error) {
                                console.warn('🔄 [Auto] Login system status check failed:', error.message);
                                // Mark all services as offline if gateway is unreachable
                                this.markAllServicesOffline();
                            }
                        }
                        
                        updateStatusFromGateway(servicesStatus) {
                            // Map individual services to their status indicators
                            const serviceMapping = {
                                'session-service': 'session',
                                'orders-service': 'orders',
                                'inventory-service': 'inventory',
                                'invoice-service': 'invoices'
                            };
                            
                            // Update individual service statuses
                            for (const [gatewayServiceName, statusKey] of Object.entries(serviceMapping)) {
                                const elementId = this.statusMapping[statusKey];
                                if (elementId) {
                                    const element = document.getElementById(elementId);
                                    if (element) {
                                        const serviceStatus = servicesStatus[gatewayServiceName];
                                        if (serviceStatus) {
                                            this.updateStatusIndicator(element, serviceStatus);
                                        }
                                    }
                                }
                            }
                            
                            // Handle gateway status separately - it should reflect overall system health
                            const gatewayElement = document.getElementById(this.statusMapping['gateway']);
                            if (gatewayElement) {
                                // Check if all services are healthy
                                const allServices = Object.values(servicesStatus);
                                const healthyServices = allServices.filter(status => status === 'healthy').length;
                                const totalServices = allServices.length;
                                
                                console.log('🔍 Gateway health check:', {
                                    healthyServices,
                                    totalServices,
                                    servicesStatus
                                });
                                
                                if (healthyServices === totalServices) {
                                    // All services healthy
                                    this.updateStatusIndicator(gatewayElement, 'healthy');
                                } else if (healthyServices > 0) {
                                    // Some services healthy, some not - gateway is degraded
                                    this.updateStatusIndicator(gatewayElement, 'degraded');
                                } else {
                                    // No services healthy - gateway is unhealthy
                                    this.updateStatusIndicator(gatewayElement, 'unhealthy');
                                }
                            }
                        }
                        
                        updateStatusIndicator(element, status) {
                            if (!element) return;
                            
                            // Remove existing status classes
                            element.classList.remove('online', 'warning', 'offline', 'loading');
                            
                            // Add appropriate status class based on health status
                            switch (status) {
                                case 'healthy':
                                    element.classList.add('online');
                                    break;
                                case 'degraded':
                                    element.classList.add('warning');
                                    break;
                                case 'unhealthy':
                                    element.classList.add('offline');
                                    break;
                                default:
                                    element.classList.add('loading');
                            }
                        }
                        
                        markAllServicesOffline() {
                            for (const elementId of Object.values(this.statusMapping)) {
                                const element = document.getElementById(elementId);
                                if (element) {
                                    this.updateStatusIndicator(element, 'unhealthy');
                                }
                            }
                        }
                        
                        setupRefreshButton() {
                            const refreshBtn = document.getElementById('login-refresh-status-btn');
                            if (refreshBtn) {
                                refreshBtn.addEventListener('click', async () => {
                                    console.log('🔄 Manual refresh requested');
                                    
                                    // Add spinning animation to button
                                    const icon = refreshBtn.querySelector('i');
                                    icon.classList.add('fa-spin');
                                    refreshBtn.disabled = true;
                                    
                                    try {
                                        // Perform immediate health check
                                        await this.performRealTimeHealthCheck();
                                        console.log('✅ Manual refresh completed');
                                    } catch (error) {
                                        console.error('❌ Manual refresh failed:', error);
                                    } finally {
                                        // Remove spinning animation
                                        icon.classList.remove('fa-spin');
                                        refreshBtn.disabled = false;
                                    }
                                });
                                console.log('✅ Refresh button setup complete');
                            }
                        }
                        
                        destroy() {
                            if (this.healthCheckInterval) {
                                clearInterval(this.healthCheckInterval);
                                this.healthCheckInterval = null;
                            }
                            console.log('🧹 Login System Status Component: Cleaned up');
                        }
                    }
                    
                    try {
                        window.loginSystemStatusComponent = new LoginSystemStatusComponent();
                        console.log('✅ Login System Status Component: Initialized from login page');
                    } catch (error) {
                        console.error('❌ Login System Status Component: Failed to initialize:', error);
                    }
                }, 500);
            }
            
            new LoginPage();
        });
    </script>
</body>
</html>
