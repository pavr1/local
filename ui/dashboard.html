        // Display existences in table
        function displayExistences(existences) {
            const container = document.getElementById('existencesTableContainer');
            
            if (!container) {
                console.error('❌ Existences table container not found');
                return;
            }

            if (!existences || existences.length === 0) {
                container.innerHTML = `
                    <div class="d-flex flex-column justify-content-center align-items-center py-5">
                        <div class="empty-state-icon">
                            <i class="fas fa-boxes"></i>
                        </div>
                        <h5 class="text-muted mb-2">No Existences Found</h5>
                        <p class="text-muted mb-3">Existences are created automatically when invoices are processed.</p>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th style="width: 8%;">Reference</th>
                                <th style="width: 15%;">Ingredient</th>
                                <th style="width: 8%;">Status</th>
                                <th style="width: 12%;">Units</th>
                                <th style="width: 8%;">Type</th>
                                <th style="width: 8%;">Items/Unit</th>
                                <th style="width: 10%;">Cost/Item</th>
                                <th style="width: 10%;">Price Range</th>
                                <th style="width: 10%;">Final Price</th>
                                <th style="width: 8%;">Actions</th>
                                <th style="width: 1%;">
                                    <button class="btn btn-action btn-toggle" onclick="toggleAllExistenceDetails()" title="Toggle All Details">
                                        <i class="fas fa-chevron-down"></i>
                                    </button>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            // Group existences by ingredient and unit type
            const groupedExistences = {};
            existences.forEach(existence => {
                const key = `${existence.ingredient_id}_${existence.unit_type}`;
                if (!groupedExistences[key]) {
                    groupedExistences[key] = [];
                }
                groupedExistences[key].push(existence);
            });

            // Sort each group by creation date (oldest first)
            Object.keys(groupedExistences).forEach(key => {
                groupedExistences[key].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            });

            // Process existences with margin comparison
            existences.forEach((existence, index) => {
                const status = getExistenceStatus(existence);
                const statusBadge = getStatusBadge(status);
                const expirationDate = existence.expiration_date ? 
                    new Date(existence.expiration_date).toLocaleDateString() : 'N/A';
                
                // Find the group for this existence
                const key = `${existence.ingredient_id}_${existence.unit_type}`;
                const group = groupedExistences[key];
                const existenceIndex = group.findIndex(e => e.id === existence.id);
                
                // Calculate margin arrow (only for existences after the first one in the group)
                let marginArrow = '';
                if (existenceIndex > 0) {
                    const previousExistence = group[existenceIndex - 1];
                    const currentMarginPercent = calculateMarginPercentage(existence);
                    const previousMarginPercent = calculateMarginPercentage(previousExistence);
                    
                    if (currentMarginPercent > previousMarginPercent) {
                        marginArrow = '<i class="fas fa-arrow-up text-success ms-1" title="Margin increased"></i>';
                    } else if (currentMarginPercent < previousMarginPercent) {
                        marginArrow = '<i class="fas fa-arrow-down text-danger ms-1" title="Margin decreased"></i>';
                    }
                }
                
                tableHTML += createExistenceRow(existence, status, statusBadge, expirationDate, marginArrow);
            });

            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = tableHTML;
            
            // Add group hover listeners after table is populated
            addGroupHoverListeners();
        }

        // Calculate margin percentage for comparison
        function calculateMarginPercentage(existence) {
            const finalPrice = Number(existence.final_price || 0);
            const costPerItem = Number(existence.cost_per_item || 0);
            const ivaPercentage = Number(existence.iva_percentage || 0);
            const serviceTaxPercentage = Number(existence.service_tax_percentage || 0);
            
            if (finalPrice <= 0) return 0;
            
            const totalTaxRate = (ivaPercentage + serviceTaxPercentage) / 100;
            const taxMultiplier = 1 + totalTaxRate;
            const baseAmount = finalPrice / taxMultiplier;
            const marginAmount = baseAmount - costPerItem;
            
            return (marginAmount / finalPrice) * 100;
        }

        // Get existence status
        function getExistenceStatus(existence) {
            const now = new Date();
            const expiration = existence.expiration_date ? new Date(existence.expiration_date) : null;
            const lowStockThreshold = existence.units_purchased * 0.1;

            if (existence.units_available <= 0) return 'out';
            if (expiration && expiration < now) return 'expired';
            if (existence.units_available <= lowStockThreshold) return 'low';
            return 'available';
        }

        // Get days until expiration
        function getDaysUntilExpiration(expirationDate) {
            const now = new Date();
            const expiration = new Date(expirationDate);
            const diffTime = expiration - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                return `<span class="text-danger">Expired ${Math.abs(diffDays)} days ago</span>`;
            } else if (diffDays === 0) {
                return `<span class="text-warning">Expires today</span>`;
            } else if (diffDays <= 7) {
                return `<span class="text-warning">${diffDays} days left</span>`;
            } else {
                return `<span class="text-success">${diffDays} days left</span>`;
            }
        }

        // Save existence
        async function saveExistence() {
            try {
                if (!validateAddExistenceForm()) {
                    return;
                }

                const saveBtn = document.getElementById('saveExistenceBtn');
                const originalText = saveBtn.innerHTML;
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving...';

                const formData = {
                    ingredient_id: document.getElementById('existenceIngredientId').value,
                    invoice_detail_id: document.getElementById('existenceInvoiceDetailId').value,
                    units_purchased: parseFloat(document.getElementById('existenceUnitsPurchased').value),
                    units_available: parseFloat(document.getElementById('existenceUnitsAvailable').value),
                    unit_type: document.getElementById('existenceUnitType').value,
                    items_per_unit: parseInt(document.getElementById('existenceItemsPerUnit').value),
                    cost_per_unit: parseFloat(document.getElementById('existenceCostPerUnit').value),
                    expiration_date: document.getElementById('existenceExpirationDate').value || null,
                    income_margin_percentage: parseFloat(document.getElementById('existenceIncomeMarginPercentage').value) || null,
                    iva_percentage: parseFloat(document.getElementById('existenceIvaPercentage').value) || null,
                    service_tax_percentage: parseFloat(document.getElementById('existenceServiceTaxPercentage').value) || null,
                    final_price: parseFloat(document.getElementById('existenceFinalPrice').value) || null
                };

                const response = await fetch(`${CONFIG.GATEWAY_URL}/api/v1/inventory/existences`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    Alert.success('Existence created successfully!');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addExistenceModal'));
                    modal.hide();
                    await loadExistencesData();
                } else {
                    Alert.error(result.message || 'Failed to create existence');
                }

            } catch (error) {
                console.error('❌ Error saving existence:', error);
                Alert.error('Failed to save existence');
            } finally {
                const saveBtn = document.getElementById('saveExistenceBtn');
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save me-2"></i>Save Existence';
            }
        }

                'existenceCostPerUnit'
            ];

            let isValid = true;

            requiredFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (!field.value.trim()) {
                    field.classList.add('is-invalid');

        // Update income preview calculations
        function updateIncomePreview(finalPrice, costPerItem, ivaPercentage, serviceTaxPercentage) {
            const finalPriceNum = parseFloat(finalPrice) || 0;
            const costPerItemNum = parseFloat(costPerItem) || 0;
            const ivaPercentageNum = parseFloat(ivaPercentage) || 0;
            const serviceTaxPercentageNum = parseFloat(serviceTaxPercentage) || 0;

            // pvillalobos - Calculate total tax rate from existence data
            const totalTaxRate = (ivaPercentageNum + serviceTaxPercentageNum) / 100; // pvillalobos - Total tax rate calculation
            const taxMultiplier = 1 + totalTaxRate; // pvillalobos - Tax multiplier for reverse calculation

            // Calculate base amount before taxes (reverse calculation)
            const baseAmount = finalPriceNum / taxMultiplier;
            const newMarginAmount = baseAmount - costPerItemNum;
            
            // Calculate tax amounts based on (cost + margin)
            const ivaAmount = baseAmount * (ivaPercentageNum / 100);
            const serviceTaxAmount = baseAmount * (serviceTaxPercentageNum / 100);
            
            // Calculate income margin percentage
            const incomeMarginPercentage = finalPriceNum > 0 ? (newMarginAmount / finalPriceNum) * 100 : 0;

            // Update display
            document.getElementById('previewIvaAmount').textContent = '₡' + ivaAmount.toFixed(2);
            document.getElementById('previewServiceTaxAmount').textContent = '₡' + serviceTaxAmount.toFixed(2);
            document.getElementById('previewIncomeMarginAmount').textContent = '₡' + newMarginAmount.toFixed(2);
            document.getElementById('previewIncomeMarginPercentage').textContent = incomeMarginPercentage.toFixed(2) + '%';

            // Update colors based on profitability
            const incomeMarginElement = document.getElementById('previewIncomeMarginAmount');
            const incomePercentageElement = document.getElementById('previewIncomeMarginPercentage');
            
            if (newMarginAmount > 0) {
                incomeMarginElement.className = 'fw-bold text-success';
                incomePercentageElement.className = 'fw-bold text-success';
            } else {
                incomeMarginElement.className = 'fw-bold text-danger';
                incomePercentageElement.className = 'fw-bold text-danger';
            }
        }

        // Update final price
        async function updateFinalPrice(existenceId) {
            const updateBtn = document.querySelector('#setFinalPriceModal .btn-primary');
            const originalText = updateBtn.innerHTML;
            
            try {
                const finalPriceInput = document.getElementById('finalPriceInput');
                const finalPrice = parseFloat(finalPriceInput.value);
                const minimumPrice = parseFloat(finalPriceInput.min);
                const maximumPrice = parseFloat(finalPriceInput.max);

                // Validate input
                if (!validateFinalPriceInput(finalPriceInput.value, minimumPrice, maximumPrice)) {
                    if (finalPrice < minimumPrice) {
                        Alert.error(`Final price cannot be lower than the minimum price (₡${minimumPrice.toLocaleString()})`);
                    } else if (finalPrice > maximumPrice) {
                        Alert.error(`Final price cannot be higher than the maximum price (₡${maximumPrice.toLocaleString()})`);
                    } else {
                        Alert.error('Please enter a valid final price');
                    }
                    return;
                }

                updateBtn.disabled = true;
                updateBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating...';

                const formData = {
                    final_price: finalPrice
                };

                const response = await authenticatedPut(`${CONFIG.GATEWAY_URL}/api/v1/inventory/existences/${existenceId}`, formData);
                const result = await response.json();

                if (response.ok && result.success) {
                    Alert.success('Final price updated successfully!');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('setFinalPriceModal'));
                    modal.hide();
                    await loadExistencesData();
                } else {
                    // Handle specific database validation errors
                    if (result.message && result.message.includes('check_final_price_range')) {
                        Alert.error(`Final price must be between ₡${minimumPrice.toLocaleString()} and ₡${maximumPrice.toLocaleString()}`);
                    } else {
                        Alert.error(result.message || 'Failed to update final price');
                    }
                }

            } catch (error) {
                console.error('❌ Error updating final price:', error);
                Alert.error('Failed to update final price');
            } finally {
                updateBtn.disabled = false;
                updateBtn.innerHTML = originalText;
            }
        }

                'editExistenceItemsPerUnit',
                'editExistenceCostPerUnit'

            let isValid = true;

            requiredFields.forEach(fieldId => {

        // Global variable to store settings data for sorting
        let currentSettings = [];

        function displaySettings(settings) {
            const tbody = document.getElementById('settingsTableBody');
            
            if (!settings || settings.length === 0) {
                displaySettingsEmpty();
                return;
            }

            // Store settings globally for sorting
            currentSettings = [...settings];
            
            // Apply initial sort by service
            sortSettings('service');
        }

        function renderSettingsTable(settings) {
            const tbody = document.getElementById('settingsTableBody');
            tbody.innerHTML = '';
            
            settings.forEach(setting => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <span class="badge bg-primary">${setting.service}</span>
                    </td>
                    <td>
                        <code class="text-dark">${setting.key}</code>
                    </td>
                    <td>
                        <div class="setting-value" title="${setting.value}">
                            ${setting.value}
                        </div>
                    </td>
                    <td>
                        <div class="setting-description" title="${setting.description || ''}">
                            ${setting.description || '-'}
                        </div>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editSetting('${setting.service}', '${setting.key}', '${setting.value}', '${setting.description || ''}')" title="Edit setting">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Sorting functionality
        let currentSortField = 'service';
        let currentSortDirection = 'asc';

        function sortSettings(field) {
            if (currentSortField === field) {
                // Toggle direction if same field
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                // New field, default to ascending
                currentSortField = field;
                currentSortDirection = 'asc';
            }

            // Update sort indicators
            updateSortIndicators(field, currentSortDirection);

            // Sort the settings
            const sortedSettings = [...currentSettings].sort((a, b) => {
                let aValue = a[field] || '';
                let bValue = b[field] || '';

                // Convert to lowercase for case-insensitive sorting
                aValue = aValue.toString().toLowerCase();
                bValue = bValue.toString().toLowerCase();

                if (currentSortDirection === 'asc') {
                    return aValue.localeCompare(bValue);
                } else {
                    return bValue.localeCompare(aValue);
                }
            });

            renderSettingsTable(sortedSettings);
        }

        function updateSortIndicators(field, direction) {
            // Remove all sort indicators
            const headers = document.querySelectorAll('#settingsTable th');
            headers.forEach(header => {
                const icon = header.querySelector('i');
                if (icon) {
                    icon.className = 'fas fa-sort ms-1';
                }
            });

            // Add sort indicator to current field
            const currentHeader = document.querySelector(`#settingsTable th[onclick*="${field}"]`);
            if (currentHeader) {
                const icon = currentHeader.querySelector('i');
                if (icon) {
                    icon.className = direction === 'asc' ? 'fas fa-sort-up ms-1' : 'fas fa-sort-down ms-1';
                }
            }
        }

        // Modal handling variables
        let currentEditingSetting = null;

        function editSetting(service, key, value, description) {
            // Store the current setting being edited
            currentEditingSetting = { service, key, value, description };
            
            // Populate the modal fields
            document.getElementById('editService').value = service;
            document.getElementById('editKey').value = key;
            document.getElementById('editValue').value = value;
            document.getElementById('editDescription').value = description || '';
            
            // Clear any previous validation errors
            document.getElementById('editValue').classList.remove('is-invalid');
            
            // Show the modal
            const modal = new bootstrap.Modal(document.getElementById('editSettingModal'));
            modal.show();
        }

        function saveSetting() {
            const valueInput = document.getElementById('editValue');
            const value = valueInput.value.trim();
            
            // Validate the value
            if (!value) {
                valueInput.classList.add('is-invalid');
                return;
            }
            
            // Clear validation error
            valueInput.classList.remove('is-invalid');
            
            // Show confirmation modal
            document.getElementById('confirmService').textContent = currentEditingSetting.service;
            document.getElementById('confirmKey').textContent = currentEditingSetting.key;
            document.getElementById('confirmValue').textContent = value;
            document.getElementById('confirmDescription').textContent = document.getElementById('editDescription').value.trim() || 'No description';
            
            // Hide edit modal and show confirmation modal
            const editModal = bootstrap.Modal.getInstance(document.getElementById('editSettingModal'));
            editModal.hide();
            
            const confirmModal = new bootstrap.Modal(document.getElementById('confirmUpdateModal'));
            confirmModal.show();
        }

        async function confirmUpdateSetting() {
            try {
                const value = document.getElementById('editValue').value.trim();
                const description = document.getElementById('editDescription').value.trim();
                
                const updateData = {
                    service: currentEditingSetting.service,
                    key: currentEditingSetting.key,
                    value: value,
                    description: description || currentEditingSetting.description || ''
                };
                
                const response = await authenticatedPost(
                    `${CONFIG.GATEWAY_URL}/api/v1/data/settings/update-setting`,
                    updateData
                );
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    // Show success message
                    showAlert('Setting updated successfully!', 'success');
                    
                    // Reload settings data
                    await loadSettingsData();
                    
                    // Close confirmation modal
                    const confirmModal = bootstrap.Modal.getInstance(document.getElementById('confirmUpdateModal'));
                    confirmModal.hide();
                    
                    // Reset current editing setting
                    currentEditingSetting = null;
                } else {
                    throw new Error(result.message || 'Failed to update setting');
                }
                
            } catch (error) {
                console.error('❌ Error updating setting:', error);
                showAlert(`Failed to update setting: ${error.message}`, 'error');
                
                // Close confirmation modal
                const confirmModal = bootstrap.Modal.getInstance(document.getElementById('confirmUpdateModal'));
                confirmModal.hide();
            }
        }

            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 250px; max-width: 90vw;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            
            document.body.appendChild(alertDiv);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }

        async function loadIngredientsForRecipe() {
            try {
                // Load ingredients
                const ingredientsResponse = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/inventory/ingredients?limit=1000`);
                
                if (!ingredientsResponse.ok) {
                    throw new Error(`HTTP ${ingredientsResponse.status}: ${ingredientsResponse.statusText}`);
                }
                
                const ingredientsResult = await ingredientsResponse.json();
                const ingredients = ingredientsResult.data || [];
                
                // Load existences to get pricing information
                const existencesResponse = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/inventory/existences?limit=1000`);
                
                if (!existencesResponse.ok) {
                    throw new Error(`HTTP ${existencesResponse.status}: ${existencesResponse.statusText}`);
                }
                
                const existencesResult = await existencesResponse.json();
                const existences = existencesResult.data || [];
                
                // Create a map of ingredient ID to most recent final price
                const ingredientPrices = new Map();
                existences.forEach(existence => {
                    if (existence.final_price && existence.final_price > 0) {
                        const currentPrice = ingredientPrices.get(existence.ingredient_id);
                        if (!currentPrice || existence.created_at > currentPrice.created_at) {
                            ingredientPrices.set(existence.ingredient_id, {
                                final_price: existence.final_price,
                                created_at: existence.created_at
                            });
                        }
                    }
                });
                
                // Merge ingredients with pricing information
                allIngredients = ingredients.map(ingredient => {
                    const priceInfo = ingredientPrices.get(ingredient.id);
                    return {
                        ...ingredient,
                        final_price: priceInfo ? priceInfo.final_price : null
                    };
                });
                
                filteredIngredients = [...allIngredients];
                
                displayIngredientsForRecipe();
                
            } catch (error) {
                console.error('❌ Error loading ingredients for recipe:', error);
                Alert.error('Failed to load ingredients. Please try again.');
            }
        }

                Alert.warning('Please select at least one ingredient.');
                return;
            }
            
            selectedCheckboxes.forEach(checkbox => {
                const ingredientId = checkbox.value;
                const ingredientName = checkbox.getAttribute('data-name');
                const unitType = checkbox.getAttribute('data-unit');
                
                // Check if ingredient is already added
                const existingIngredient = recipeIngredients.find(ing => ing.id === ingredientId);
                if (!existingIngredient) {
                    // Find the ingredient with pricing information
                    const ingredientWithPrice = allIngredients.find(ing => ing.id === ingredientId);
                    
                    const ingredient = {
                        id: ingredientId,
                        name: ingredientName,
                        unit_type: unitType,
                        quantity: 1,
                        final_price: ingredientWithPrice ? ingredientWithPrice.final_price : 0
                    };
                    
                    recipeIngredients.push(ingredient);

        async function loadIngredientForView(ingredientId) {
            try {
                const response = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/inventory/ingredients/${ingredientId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                const ingredient = result.data;
                
                // Get category and supplier names if IDs exist
                let categoryName = 'Not assigned';
                let supplierName = 'Not assigned';
                
                if (ingredient.ingredient_category_id) {
                    try {
                        const categoryResponse = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/inventory/ingredient-categories/${ingredient.ingredient_category_id}`);
                        if (categoryResponse.ok) {
                            const categoryResult = await categoryResponse.json();
                            categoryName = categoryResult.data.name;
                        }
                    } catch (error) {
                        console.warn('Could not fetch category name:', error);
                    }
                }
                
                if (ingredient.supplier_id) {
                    try {
                        const supplierResponse = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/inventory/suppliers/${ingredient.supplier_id}`);
                        if (supplierResponse.ok) {
                            const supplierResult = await supplierResponse.json();
                            supplierName = supplierResult.data.supplier_name;
                        }
                    } catch (error) {
                        console.warn('Could not fetch supplier name:', error);
                    }
                }
                
                // Populate view modal
                document.getElementById('viewIngredientContent').innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <h6 class="fw-bold">Ingredient Information</h6>
                            <table class="table table-borderless">
                                <tr>
                                    <td class="fw-bold">Name:</td>
                                    <td><strong>${ingredient.name}</strong></td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">Category:</td>
                                    <td>${categoryName}</td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">Supplier:</td>
                                    <td>${supplierName}</td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">Description:</td>
                                    <td>${ingredient.description || 'No description provided'}</td>
                                </tr>
                                <tr>

                                    <td>${new Date(ingredient.created_at).toLocaleString()}</td>
                                </tr>
                                <tr>

                                </tr>

                modal.show();

                console.error('❌ Error loading ingredient for view:', error);

        async function loadIngredientForEdit(ingredientId) {
            try {
                const response = await authenticatedGet(`${CONFIG.GATEWAY_URL}/api/v1/inventory/ingredients/${ingredientId}`);
                
                if (!response.ok) {

                // Get category name if ID exists
                let categoryName = '';
                
                if (ingredient.ingredient_category_id) {

        window.updateIngredient = async function() {
            const form = document.getElementById('editIngredientForm');
            const updateBtn = document.querySelector('#editIngredientModal .btn-save-ingredient');
            
            if (!currentIngredientForEdit) {
                Alert.error('No ingredient selected for update.');
                return;
            }
            
            // Reset validation state
            form.classList.remove('was-validated');
            form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            
            // Collect form data
            const formData = new FormData(form);
            const ingredientData = {};
            
            // Process form fields
            for (let [key, value] of formData.entries()) {
                const trimmedValue = value.trim();
                if (trimmedValue) {
                    ingredientData[key] = trimmedValue;
                }
            }
            
            // Validate required fields
            let isValid = true;
            
            if (!ingredientData.name || ingredientData.name.length < 1 || ingredientData.name.length > 255) {
                document.getElementById('editIngredientName').classList.add('is-invalid');
                isValid = false;
            }
            
            if (!isValid) {
                form.classList.add('was-validated');
                return;
            }
            
            // Update button state
            updateBtn.disabled = true;
            updateBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating...';
            
            try {
                const response = await authenticatedPut(`${CONFIG.GATEWAY_URL}/api/v1/inventory/ingredients/${currentIngredientForEdit.id}`, ingredientData);
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    Alert.success('Ingredient updated successfully!');
                    
                    // Hide modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('editIngredientModal'));
                    modal.hide();
                    
                    // Reload data
                    await loadIngredientsData();
                } else {
                    throw new Error(result.message || 'Failed to update ingredient');
                }
                
            } catch (error) {
                console.error('❌ Error updating ingredient:', error);
                Alert.error('Failed to update ingredient. Please check your connection and try again.');
            }
            
            // Reset button state
            updateBtn.disabled = false;
            updateBtn.innerHTML = '<i class="fas fa-save me-2"></i>Update Ingredient';
        };

        async function deleteIngredientConfirm(ingredientId) {
            const confirmed = await Swal.fire({
                title: 'Delete Ingredient?',
                text: `Are you sure you want to delete this ingredient? This action cannot be undone.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!',
                cancelButtonText: 'Cancel'
            });
            
            if (confirmed.isConfirmed) {
                try {
                                    const response = await authenticatedDelete(`${CONFIG.GATEWAY_URL}/api/v1/inventory/ingredients/${ingredientId}`);
                    
                    if (response.ok) {
                        Alert.success('Ingredient deleted successfully!');
                        await loadIngredientsData();
                    } else {
                        const result = await response.json();
                        throw new Error(result.message || 'Failed to delete ingredient');
                    }
                    
                } catch (error) {
                    console.error('❌ Error deleting ingredient:', error);
                    Alert.error('Failed to delete ingredient. Please try again.');
                }
            }
        }

        // Remove item row function for invoice modal
        window.removeItemRow = function(index) {
            const container = document.getElementById('itemsContainer');
            if (!container) return;
            
            const rows = container.querySelectorAll('.item-row');
            if (rows.length > 1) {
                rows[index].remove();
                // Reindex remaining rows
                container.querySelectorAll('.item-row').forEach((row, newIndex) => {
                    row.dataset.index = newIndex;
                    row.querySelector('.remove-item-btn').onclick = () => removeItemRow(newIndex);
                });
            }
        };

                                    <label for="editExistenceReferenceCode" class="form-label">Reference Code</label>
                                    <input type="text" class="form-control" id="editExistenceReferenceCode" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceIngredient" class="form-label">Ingredient</label>
                                    <input type="text" class="form-control" id="editExistenceIngredient" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceInvoiceDetailId" class="form-label">Invoice Detail ID</label>
                                    <input type="text" class="form-control" id="editExistenceInvoiceDetailId" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceExpirationDate" class="form-label">Expiration Date</label>
                                    <input type="date" class="form-control" id="editExistenceExpirationDate">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editExistenceUnitsPurchased" class="form-label">Units Purchased</label>
                                    <input type="number" class="form-control" id="editExistenceUnitsPurchased" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceUnitsAvailable" class="form-label">Units Available</label>
                                    <input type="number" class="form-control" id="editExistenceUnitsAvailable" step="0.01" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceUnitType" class="form-label">Unit Type</label>
                                    <input type="text" class="form-control" id="editExistenceUnitType" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceItemsPerUnit" class="form-label">Items Per Unit</label>
                                    <input type="number" class="form-control" id="editExistenceItemsPerUnit" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editExistenceCostPerUnit" class="form-label">Cost Per Unit</label>
                                    <input type="number" class="form-control" id="editExistenceCostPerUnit" step="0.01" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceIncomeMarginPercentage" class="form-label">Income Margin Percentage</label>
                                    <input type="number" class="form-control" id="editExistenceIncomeMarginPercentage" step="0.01">
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceIvaPercentage" class="form-label">IVA Percentage</label>
                                    <input type="number" class="form-control" id="editExistenceIvaPercentage" step="0.01">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editExistenceServiceTaxPercentage" class="form-label">Service Tax Percentage</label>
                                    <input type="number" class="form-control" id="editExistenceServiceTaxPercentage" step="0.01">
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceMinimumPrice" class="form-label">Minimum Price</label>
                                    <input type="number" class="form-control" id="editExistenceMinimumPrice" step="0.01" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceMaximumPrice" class="form-label">Maximum Price</label>
                                    <input type="number" class="form-control" id="editExistenceMaximumPrice" step="0.01" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="editExistenceFinalPrice" class="form-label">Final Price</label>
                                    <input type="number" class="form-control" id="editExistenceFinalPrice" step="0.01">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="updateExistenceBtn" onclick="updateExistence()">
                        <i class="fas fa-save me-2"></i>Update Existence
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Service Logs Modal -->
    <div class="modal fade" id="serviceLogsModal" tabindex="-1">
        <div class="modal-dialog modal-xl" style="max-width: 95%; width: 95%;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-file-alt me-2"></i>
                        <span id="logsModalTitle">Service Logs</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <select class="form-select" id="logsServiceSelect" onchange="changeLogsService()">
                                <option value="">All Services</option>
                                <option value="gateway-service">Gateway Service</option>
                                <option value="session-service">Session Service</option>
                                <option value="orders-service">Orders Service</option>
                                <option value="inventory-service">Inventory Service</option>
                                <option value="invoice-service">Invoice Service</option>
                                <option value="data-service">Data Service</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="logsLevelSelect" onchange="filterLogs()">
                                <option value="">All Levels</option>
                                <option value="DEBUG">Debug</option>
                                <option value="INFO">Info</option>
                                <option value="WARN">Warning</option>
                                <option value="ERROR">Error</option>
                                <option value="FATAL">Fatal</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <div class="input-group">
                                <input type="text" class="form-control" id="logsSearchInput" placeholder="Search in logs..." onkeyup="filterLogs()">
                                <button class="btn btn-outline-primary" type="button" onclick="filterLogs()">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-outline-secondary" onclick="clearLogsSearch()">
                                <i class="fas fa-times me-1"></i>Clear
                            </button>
                            <button class="btn btn-outline-success" onclick="toggleLogsAutoRefresh()" id="autoRefreshBtn">
                                <i class="fas fa-play me-1"></i>Auto
                            </button>
                        </div>
                    </div>
                    <div class="logs-container">
                        <div id="logsContent" class="logs-content">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-3">Loading logs...</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="refreshLogs()">
                        <i class="fas fa-sync me-1"></i>Refresh
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
