<!-- Login System Status Component - Simplified Version -->
<div class="login-system-status mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="text-muted mb-0">System Status</h6>
        <button class="btn btn-sm btn-outline-light refresh-status-btn" id="login-refresh-status-btn" title="Refresh Status">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>
    <div class="login-status-grid">
        <div class="login-status-item">
            <div class="status-indicator loading" id="login-gateway-status"></div>
            <span>Gateway</span>
        </div>
        <div class="login-status-item">
            <div class="status-indicator loading" id="login-session-status"></div>
            <span>Session</span>
        </div>
        <div class="login-status-item">
            <div class="status-indicator loading" id="login-orders-status"></div>
            <span>Orders</span>
        </div>
        <div class="login-status-item">
            <div class="status-indicator loading" id="login-inventory-status"></div>
            <span>Inventory</span>
        </div>
        <div class="login-status-item">
            <div class="status-indicator loading" id="login-invoices-status"></div>
            <span>Invoice</span>
        </div>
    </div>
</div>
