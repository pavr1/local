services:
  gateway-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: icecream_gateway
    restart: unless-stopped
    environment:
      # Server Configuration
      GATEWAY_SERVER_HOST: 0.0.0.0
      GATEWAY_SERVER_PORT: 8082
      
      # Service URLs (internal Docker network)
      SESSION_SERVICE_URL: ${SESSION_SERVICE_URL:-http://icecream_session:8081}
      ORDERS_SERVICE_URL: ${ORDERS_SERVICE_URL:-http://icecream_orders:8083}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://icecream_inventory:8084}
      INVOICE_SERVICE_URL: ${INVOICE_SERVICE_URL:-http://icecream_invoice:8085}
      
      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/v1/gateway/p/health"]
      interval: 1s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docker_icecream_network

networks:
  docker_icecream_network:
    external: true 