services:
  session-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: icecream_session
    restart: unless-stopped
    environment:
      # Server Configuration
      SESSION_SERVER_HOST: 0.0.0.0
      SESSION_SERVER_PORT: 8081
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: icecream_store
      DB_SSLMODE: disable
      
      # JWT Configuration
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION_TIME: 30m
      
      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/sessions/p/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - docker_icecream_network

  postgres:
    image: postgres:15-alpine
    container_name: icecream_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: icecream_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icecream_store"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docker_icecream_network

volumes:
  postgres_data:
    driver: local

networks:
  docker_icecream_network:
    external: true
