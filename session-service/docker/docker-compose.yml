services:
  session-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: icecream_session
    restart: unless-stopped
    environment:
      # Server Configuration
      SESSION_SERVER_HOST: 0.0.0.0
      SESSION_SERVER_PORT: 8081
      
      # Data Service Configuration
      DATA_SERVICE_URL: http://icecream_data_service:8086
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: icecream_store
      DB_SSLMODE: disable
      
      # JWT Configuration
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION_TIME: 30m
      
      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/sessions/p/health"]
      interval: 1s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docker_icecream_network

networks:
  docker_icecream_network:
    external: true
